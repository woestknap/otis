<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Otis Companion Bot: a sci-fi Three.js project site for a responsive companion robot."
    />
    <title>Otis Companion Bot</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Interactive 3D companion bot scene"></canvas>
      <section class="hud" aria-label="Project overview">
        <p class="eyebrow">Companion Robotics Lab</p>
        <h1>Otis Companion Bot</h1>
        <p class="lede">
          A responsive desktop companion built around expressive motion, quiet intelligence, and hardware that feels alive.
        </p>
      </section>
      <section class="corner-map" aria-label="Scene navigation">
        <span>Mission</span>
        <span>Hardware</span>
        <span>Intelligence</span>
        <span>Roadmap</span>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
